plugins { id 'com.android.application' }

android {
    namespace 'dev.haystack.tv'
    compileSdk 35
    defaultConfig {
        applicationId 'dev.haystack.tv'
        minSdk 28
        targetSdk 35
        versionCode 1
        versionName '0.1-fixture'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    def keyStorePath = System.getenv('HAYSTACK_TV_KEYSTORE')
    def passwordPath = System.getenv('HAYSTACK_TV_PASSWORD_FILE')
    if (keyStorePath && passwordPath) {
        signingConfigs {
            release {
                storeFile file(keyStorePath)
                storePassword file(passwordPath).text.trim()
                keyAlias 'haystack-tv'
                keyPassword storePassword
            }
        }
        buildTypes.release.signingConfig signingConfigs.release
    }
    testOptions.unitTests.includeAndroidResources = true
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
