<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Haystack Kiosk</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #000;
      overflow: hidden;
      cursor: none;
      width: 100vw;
      height: 100vh;
    }

    .layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: opacity 2s ease-in-out;
    }

    #front { opacity: 1; z-index: 1; }
    #back  { opacity: 0; z-index: 0; }
  </style>
</head>
<body>
  <img id="front" class="layer" alt="">
  <img id="back"  class="layer" alt="">

  <script>
    (function () {
      var POLL_INTERVAL = 60000; // 60 seconds
      var currentId = null;
      var front = document.getElementById("front");
      var back = document.getElementById("back");
      var swapped = false;

      function getFront() { return swapped ? back : front; }
      function getBack()  { return swapped ? front : back; }

      function applyImage(url) {
        var incoming = getBack();
        var outgoing = getFront();

        incoming.onload = function () {
          // Crossfade: show incoming, hide outgoing
          incoming.style.opacity = "1";
          incoming.style.zIndex = "1";
          outgoing.style.opacity = "0";
          outgoing.style.zIndex = "0";
          swapped = !swapped;
        };
        // Cache-bust to ensure fresh image
        incoming.src = url + "?t=" + Date.now();
      }

      function poll() {
        var xhr = new XMLHttpRequest();
        xhr.open("GET", "/api/latest");
        xhr.onload = function () {
          if (xhr.status === 200) {
            try {
              var data = JSON.parse(xhr.responseText);
              if (data.metadata && data.metadata.id !== currentId) {
                currentId = data.metadata.id;
                applyImage(data.imageUrl);
              }
            } catch (e) {
              // Ignore parse errors, retry next poll
            }
          }
          // 404 or other errors: keep displaying current image, retry next poll
        };
        xhr.onerror = function () {
          // Network error: keep displaying current image, retry next poll
        };
        xhr.send();
      }

      // Initial fetch, then poll on interval
      poll();
      setInterval(poll, POLL_INTERVAL);
    })();
  </script>
</body>
</html>
